{% extends 'base.html' %}
{% load static %}
{% block title %}Feedback{% endblock %}
{% block content %}
  <h1 class="mb-4">💬 Feedback / Bug Report</h1>
  <form method="POST" action="{% url 'feedback' %}" class="mx-auto" style="max-width:600px;">
    {% csrf_token %}
    <div class="mb-3">
      <label for="feedback_type" class="form-label"><strong>Type</strong></label>
      <select id="feedback_type" name="feedback_type" class="form-select" required>
        <option value="feedback">Feedback</option>
        <option value="bug">Bug Report</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label"><strong>Your Message</strong></label>
      <textarea id="message" name="message" rows="6" class="form-control" placeholder="Write your thoughts or report here..." required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <a href="{% url 'settings' %}" class="btn btn-secondary ms-2">Back to Settings</a>
  </form>
{% endblock %}
