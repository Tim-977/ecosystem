<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
</head>
<body>
  <h1>Settings</h1>

  <!-- General Settings -->
  <h2>General Settings</h2>

  <label>Username / Display Name</label><br>
  <input type="text" placeholder="Enter your username"><br><br>

  <label>Email</label><br>
  <input type="email" placeholder="Enter your email"><br><br>

  <label>Theme (soon)</label><br>
  <input type="text" disabled placeholder="Coming soon"><br><br>

  <label>Language (soon)</label><br>
  <input type="text" disabled placeholder="Coming soon"><br><br>

  <label>Time Format (optional)</label><br>
  <select>
    <option value="12">12h</option>
    <option value="24">24h</option>
  </select><br><br>

  <!-- Personalization -->
  <h2>Personalization</h2>

  <label>Gender</label><br>
  <select>
    <option value="">Select</option>
    <option value="1">Male</option>
    <option value="2">Female</option>
  </select><br><br>

  <label>Birthday (optional)</label><br>
  <input type="date"><br><br>

  <!-- Data -->
  <h2>Data</h2>

  <button>Export Data</button><br><br>
  <button>Clear All Logs</button><br><br>
  <button>Reset All Settings</button><br><br>
  <button>Download All Data (as JSON)</button><br><br>

  <!-- Privacy and Security -->
  <h2>Privacy and Security (soon)</h2>

  <label>App Lock (future)</label><br>
  <input type="text" disabled placeholder="Coming soon"><br><br>

  <label>Local-only Mode (future)</label><br>
  <input type="text" disabled placeholder="Coming soon"><br><br>

  <label>Data Usage Disclaimer (future)</label><br>
  <input type="text" disabled placeholder="Coming soon"><br><br>

  <!-- About / Support -->
  <h2>About / Support</h2>

  <label>App Version</label><br>
  <input type="text" value="v0.1" disabled><br><br>

  <button>Report a Bug</button><br><br>
  <button>Give Feedback</button><br><br>
  <button>Developer Info</button><br><br>
  <button>Donate / Support Me</button><br><br>
  <button>Changelog / What's New</button><br><br>
  <button>Open Source / Licenses</button><br><br>
</body>
</html>
