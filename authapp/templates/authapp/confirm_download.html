{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Password</title>
  <link rel="stylesheet" href="{% static 'authapp/css/settings.css' %}">
</head>
<body>
  <h1>Confirm Password to Download Your Data</h1>

  <form method="POST" action="{% url 'confirm_password_download' %}">
    {% csrf_token %}
    <p>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </p>
    {% if error %}
      <p style="color: red;">{{ error }}</p>
    {% endif %}
    <button type="submit">Confirm and Download</button>
    <a href="{% url 'settings' %}"><button type="button">Cancel</button></a>
  </form>
</body>
</html>
