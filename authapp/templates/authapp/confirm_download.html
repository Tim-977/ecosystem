{% extends 'base.html' %}
{% load static %}
{% block title %}Confirm Download{% endblock %}
{% block content %}
  <h1 class="mb-4">Confirm Password to Download Your Data</h1>
  <form method="POST" action="{% url 'confirm_password_download' %}" class="mx-auto" style="max-width:400px;">
    {% csrf_token %}
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <button type="submit" class="btn btn-primary">Confirm and Download</button>
    <a href="{% url 'settings' %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
{% endblock %}
