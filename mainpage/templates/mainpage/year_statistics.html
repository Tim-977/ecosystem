{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yearly Overview: {{ year }}</title>
  <link rel="stylesheet" href="{% static 'mainpage/css/monthly.css' %}">
  <style>
    .download-btn {
      background-color: #007bff;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 20px auto;
      display: block;
    }

    .download-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <header style="padding: 20px; text-align: center;">
    <h1>Yearly Circular Activity Graph</h1>
    <h2>{{ year }}</h2>
  </header>

  <main style="text-align: center;">
    <a download="year_activity_graph_{{ year }}.png" href="{{ diagram_base64 }}">
      <button class="download-btn">Download PNG</button>
    </a>

    <div style="margin: 30px auto; max-width: 90%;">
      <img src="{{ diagram_base64 }}" alt="Yearly Graph"
           style="width: 100%; max-width: 1000px; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.2);" />
    </div>
  </main>
</body>
</html>
